name: Release

# Third-party actions are pinned to a commit hash, with the version they
# correspond to in a trailing comment; Dependabot updates both. The exception is
# `dtolnay/rust-toolchain`, where the ref is not a version but the toolchain to
# install – `@stable` and `@nightly` are branches that are meant to move.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v3.0.0)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub release"
        required: false
        default: false
        type: boolean

jobs:
  build-macos-aarch64:
    name: Build macOS ARM
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --all-features --target aarch64-apple-darwin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/petname
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS Intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --all-features --target x86_64-apple-darwin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/petname
          if-no-files-found: error

  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --all-features --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/petname
          if-no-files-found: error

  build-linux-aarch64:
    name: Build Linux aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --all-features --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-aarch64
          path: target/aarch64-unknown-linux-musl/release/petname
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [build-macos-aarch64, build-macos-x86_64, build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.create_release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-apple-darwin
          path: aarch64-apple-darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-apple-darwin
          path: x86_64-apple-darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-aarch64
          path: linux-aarch64
      - name: Rename executables
        run: |
          mv -v aarch64-apple-darwin/petname petname-aarch64-apple-darwin
          mv -v x86_64-apple-darwin/petname petname-x86_64-apple-darwin
          mv -v linux-x86_64/petname petname-x86_64-unknown-linux-musl
          mv -v linux-aarch64/petname petname-aarch64-unknown-linux-musl
          find .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            petname-aarch64-apple-darwin
            petname-x86_64-apple-darwin
            petname-x86_64-unknown-linux-musl
            petname-aarch64-unknown-linux-musl
          fail_on_unmatched_files: true
